{% extends "base.html" %}{% block title %}Report Agricultural Issue{% endblock %}{% block content %}<div class="layout-dashboard">{% include 'components/sidebar.html' %}<main class="content-area"><h1 class="page-title">Report Agricultural Issue</h1><div class="card" style="max-width:700px;"><form method="POST" enctype="multipart/form-data">{{ form.hidden_tag() }}<div class="form-group"><label>Issue Title *</label><input type="text" name="title" class="form-control" required placeholder="e.g. Pest attack on rice crop"></div><div class="form-row"><div class="form-group"><label>Category *</label><select name="category_id" class="form-control" required>{% for id,name in form.category_id.choices %}<option value="{{ id }}">{{ name }}</option>{% endfor %}</select></div><div class="form-group"><label>Priority</label><select name="priority" class="form-control">{% for v,l in form.priority.choices %}<option value="{{ v }}">{{ l }}</option>{% endfor %}</select></div></div><div class="form-group"><label>Description *</label><textarea name="description" class="form-control" rows="5" required placeholder="Describe the agricultural problem in detail..."></textarea></div><div class="form-row"><div class="form-group"><label>Affected Crop</label><input type="text" name="crop_name" class="form-control" placeholder="e.g. Rice, Wheat..."></div><div class="form-group"><label>Affected Area (Acres)</label><input type="number" name="affected_area" class="form-control" step="0.1"></div></div><div class="form-group"><label>Farm</label><select name="farm_id" class="form-control">{% for id,name in form.farm_id.choices %}<option value="{{ id }}">{{ name }}</option>{% endfor %}</select></div><div class="form-group"><label>Location *</label><input type="text" name="location" class="form-control" required><input type="hidden" name="latitude"><input type="hidden" name="longitude"></div><div class="form-group"><label>Upload Images</label><input type="file" name="images" class="form-control" multiple accept="image/*"></div><button type="submit" class="btn btn-primary btn-lg mt-md">Submit Issue</button></form></div></main></div>{% endblock %}
